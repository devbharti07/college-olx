services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-classifieds-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: campus-classifieds-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8080
      # SMTP — dev defaults point to Mailpit (safe, no real emails sent)
      # Override in production .env with real SMTP credentials
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-1025}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-noreply@campus-classifieds.local}
      KC_SMTP_FROM_DISPLAY: ${KC_SMTP_FROM_DISPLAY:-Campus Classifieds}
      KC_SMTP_AUTH: ${KC_SMTP_AUTH:-false}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-false}
      KC_SMTP_SSL: ${KC_SMTP_SSL:-false}
      # Leave blank in dev — only set in production .env
      KC_SMTP_USER: ${KC_SMTP_USER:-}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ==============================================================================
  # Mailpit — Safe local SMTP inbox for development
  # Web UI : http://localhost:8025   (view all captured emails)
  # SMTP   : localhost:1025          (internal Docker: mailpit:1025)
  # No real emails are ever sent. All outgoing mail is captured here.
  # ==============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: campus-classifieds-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI for reading captured emails
      - "1025:1025"   # SMTP port (Keycloak sends here)
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  postgres_data:
    driver: local
